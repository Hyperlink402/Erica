<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 AI 뉴스 브리핑</title>
  <link rel="stylesheet" href="news-card-ratio.css">
  <style>
    /* 전체 화이트 톤 스타일링 */
    :root {
      --bg-color: #F9FAFB;
      --card-bg: #FFFFFF;
      --border-color: #E5E7EB;
      --border-hover: #D1D5DB;
      --text-main: #111827;
      --text-sub: #4B5563;
      --text-muted: #9CA3AF;
      --accent-color: #2563EB;
      --accent-light: #EFF6FF;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    /* 헤더 영역 */
    header {
      margin-bottom: 32px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 8px;
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* 컨트롤 버튼 */
    .controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .btn-refresh {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-refresh:hover {
      border-color: var(--border-hover);
      background-color: #F3F4F6;
    }

    .btn-refresh:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 뉴스 리스트 및 카드 */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .news-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .news-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-md);
    }

    .news-header {
      padding: 24px 32px;
      padding: 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      text-decoration: none;    /* 1. 밑줄 제거 */
      color: var(--text-sub);
    }

    .news-main-info {
      flex: 1;
    }

    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: var(--accent-light);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .news-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .news-summary {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 꺽쇠(Chevron) 버튼 및 회전 애니메이션 */
    .toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .news-card:hover .toggle-btn {
      color: var(--text-main);
    }

    .chevron-icon {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .news-card.active .chevron-icon {
      transform: rotate(180deg);
    }

    /* 상세 내용 및 출처 영역 (토글 대상) */
    .news-detail-wrapper {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease-in-out;
      background-color: #FAFAFA;
      border-top: 0px solid var(--border-color);
    }

    .news-card.active .news-detail-wrapper {
      max-height: 1000px;
      border-top-width: 1px;
    }

    .news-detail-content {
      padding: 20px;
      font-size: 0.92rem;
      color: var(--text-sub);
      line-height: 1.6;
    }

    .news-detail-content h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .detail-text {
      margin-bottom: 16px;
      white-space: pre-line;
    }

    /* 출처 링크 영역 */
    .source-section {
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
      margin-top: 12px;
      padding-left: 24px;
    }

    .source-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      list-style: none;
    }

    .source-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      
      /* === 하이퍼링크 효과 제거 설정 === */
      text-decoration: none;    /* 1. 밑줄 제거 */
      color: var(--text-sub);   /* 2. 파란색 대신 일반 본문 글자 색상 적용 (또나 color: inherit) */
      
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .source-chip:hover {
      background-color: var(--accent-light);
    }

    /* 로딩 상태 표기 */
    .loading-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-sub);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .detail-loading {
      padding: 20px;
      text-align: center;
    }

    .detail-loading .spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 8px;
    }

    .detail-loading p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 무한 스크롤 로딩 표시 */
 infinite-scroll-loader {
    text-align: center;
    padding: 24px 0;
    min-height: 100px; /* 감지 영역 높이 확보 */
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease;
}

.infinite-scroll-loader.active {
  opacity: 1;
  visibility: visible;
}

.no-more-news {
  text-align: center;
  padding: 24px 0;
  color: var(--text-muted);
  font-size: 0.9rem;
  display: none; /* 데이터가 더 이상 없을 때만 활성화 */
}

    .infinite-scroll-loader.active {
      display: block;
    }

    .infinite-scroll-loader .spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 8px;
    }

    .infinite-scroll-loader p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .no-more-news {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    a, a:link, a:visited, a:hover, a:active {
    color: inherit !important;        /* 부모 요소 글자색(기본 검은/회색) 그대로 따라감 */
    text-decoration: none !important; /* 밑줄 제거 */
    }
    
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>실시간 주요 뉴스 브리핑</h1>
      <p>Google News RSS에서 실시간 화제 기사를 선별합니다.</p>
    </header>

    <div class="controls">
      <button class="btn-refresh" id="refreshBtn">
        🔄 뉴스 새로고침
      </button>
    </div>

    <div id="newsContainer" class="news-list">
      <!-- 뉴스 카드가 스크립트에 의해 여기에 동적으로 생성됩니다. -->
    </div>

    <div class="infinite-scroll-loader" id="infiniteLoader">
      <div class="spinner"></div>
      <p>더 많은 뉴스를 불러오는 중...</p>
    </div>

    <div class="no-more-news" id="noMoreNews" style="display: none;">
      더 이상 뉴스가 없습니다.
    </div>
  </div>

  <script>
    const newsContainer = document.getElementById('newsContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const infiniteLoader = document.getElementById('infiniteLoader');
    const noMoreNews = document.getElementById('noMoreNews');
    
    let newsData = [];
    let currentPage = 1;
    let hasMore = true;
    let isLoading = false;

    // 무한 스크롤 Observer 감시 제어
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && hasMore && !isLoading) {
        fetchNewsSummaries(currentPage + 1, true);
      }
    }, { rootMargin: '100px' });

    function setupInfiniteScroll() {
      if (infiniteLoader) {
        observer.observe(infiniteLoader);
      }
    }

    function stopInfiniteScroll() {
      if (infiniteLoader) {
        observer.unobserve(infiniteLoader);
      }
    }

    // 뉴스 요약 로드
    async function fetchNewsSummaries(page = 1, append = false) {
      if (isLoading) return;
      isLoading = true;

      // 데이터 렌더링 중 감지되어 중복 요청되는 것을 방지하기 위해 일시 해제
      stopInfiniteScroll();

      if (!append) {
        infiniteLoader.classList.remove('active');
        noMoreNews.style.display = 'none';
        showLoading();
      } else {
        infiniteLoader.classList.add('active');
      }
      refreshBtn.disabled = true;

      try {
        const response = await fetch(`/api/generate-summary?page=${page}`);
        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `서버 에러가 발생했습니다. (Status: ${response.status})`);
        }
        
        const data = await response.json();
        
        if (!append) {
          newsData = data.items || [];
          currentPage = data.page || 1;
          hasMore = data.hasMore ?? false;
          renderNewsCards(newsData, false);
        } else {
          newsData = [...newsData, ...(data.items || [])];
          currentPage = data.page || 1;
          hasMore = data.hasMore ?? false;
          renderNewsCards(data.items || [], true);
        }

        if (!hasMore) {
          infiniteLoader.classList.remove('active');
          noMoreNews.style.display = 'block';
        } else {
          infiniteLoader.classList.remove('active');
          // 가져올 데이터가 남아있을 경우에만 다시 감시 시작
          setupInfiniteScroll();
        }
      } catch (error) {
        console.error("Error:", error);
        if (!append) {
          showError(error.message);
        } else {
          infiniteLoader.classList.remove('active');
          console.error("페이지 로드 실패:", error.message);
        }
      } finally {
        isLoading = false;
        refreshBtn.disabled = false;
      }
    }

    function renderNewsCards(newsItems, append = false) {
      if (!Array.isArray(newsItems) || newsItems.length === 0) {
        if (!append) {
          showError("표시할 뉴스 데이터가 없습니다.");
        }
        return;
      }

      if (!append) {
        newsContainer.innerHTML = '';
      }

      newsItems.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'news-card';

        card.innerHTML = `
          <div class="news-header">
            <div class="news-main-info">
              <span class="category-badge">${item.category || '뉴스'}</span>
              <h2 class="news-title">${item.title}</h2>
              <p class="news-summary">${item.summary}</p>
            </div>
            <button class="toggle-btn" aria-label="상세보기 토글">
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
          </div>
          <div class="news-detail-wrapper">
            <div class="news-detail-content">
              <div class="detail-loading">
                <div class="spinner"></div>
                <p>상세 정보 로드 중...</p>
              </div>
            </div>
          </div>
        `;

        const headerEl = card.querySelector('.news-header');
        const detailWrapper = card.querySelector('.news-detail-wrapper');
        let detailLoaded = false;
        let isFetchingDetail = false;

        headerEl.addEventListener('click', async () => {
          card.classList.toggle('active');

          // 처음 열 때만 API 호출 (중복 호출 방지)
          if (card.classList.contains('active') && !detailLoaded && !isFetchingDetail) {
            isFetchingDetail = true;
            try {
              const response = await fetch(`/api/generate-detail?id=${item.id}&title=${encodeURIComponent(item.title)}`);
              if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || '상세 정보 로드 실패');
              }
              
              const detail = await response.json();
              
              const sourcesHtml = detail.sources && detail.sources.length > 0
                ? detail.sources.map(src => `<a href="${src.url}" target="_blank" rel="noopener noreferrer" class="source-chip">🔗 ${src.name}</a>`).join('')
                : '<span style="font-size:0.8rem; color:var(--text-muted);">출처 정보 없음</span>';

              detailWrapper.innerHTML = `
                <div class="news-detail-content">
                  <h4>상세 브리핑</h4>
                  <p class="detail-text">${detail.details}</p>
                  <div class="source-section">
                    <h4>기사 출처</h4>
                    <div class="source-list">
                      ${sourcesHtml}
                    </div>
                  </div>
                </div>
              `;
              detailLoaded = true;
            } catch (error) {
              console.error("Detail Fetch Error:", error);
              detailWrapper.innerHTML = `
                <div class="news-detail-content" style="color: #EF4444; padding: 20px; text-align: center;">
                  <p>${error.message || '상세 정보를 불러올 수 없습니다.'}</p>
                </div>
              `;
            } finally {
              isFetchingDetail = false;
            }
          }
        });

        newsContainer.appendChild(card);
      });
    }

    function showLoading() {
      newsContainer.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>뉴스 목록을 불러오는 중입니다...</p>
        </div>
      `;
    }

    function showError(message) {
      newsContainer.innerHTML = `
        <div class="loading-state">
          <p style="color: #EF4444; font-weight: 500;">${message}</p>
          <p style="color: #9CA3AF; font-size: 0.85rem; margin-top: 8px;">문제가 계속되면 개발자 콘솔을 확인하세요.</p>
        </div>
      `;
    }

    // 새로고침 버튼 이벤트
    refreshBtn.addEventListener('click', () => {
      currentPage = 1;
      hasMore = true;
      fetchNewsSummaries(1, false);
    });
    
    // 초기 실행
    fetchNewsSummaries(1, false);
  </script>
</body>
</html>
