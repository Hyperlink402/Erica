<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Teensight</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f4f3f8",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e3e2e7",
                        "surface": "#faf9fe",
                        "background": "#faf9fe",
                        "on-surface-variant": "#4c4546",
                        "on-surface": "#1a1b1f",
                        "primary": "#000000"
                    },
                    "fontFamily": {
                        "body-md": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"]
                    }
                },
            },
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
        }
        .specular-border {
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            transition: transform 0.3s ease;
        }
        .rotate-180 {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col custom-scrollbar antialiased">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-40 w-full bg-surface/80 backdrop-blur-3xl border-b border-black/5 px-6 h-16 flex items-center justify-between shadow-sm">
        <div class="max-w-4xl mx-auto w-full flex items-center justify-between">
            <h1 class="font-display-lg text-xl sm:text-2xl font-bold tracking-tight text-primary">Teensight</h1>
            <button id="refreshBtn" class="flex items-center gap-2 bg-white/90 hover:bg-white text-primary px-4 py-2 rounded-full border border-black/10 shadow-sm transition-all active:scale-95 text-xs sm:text-sm font-bold cursor-pointer disabled:opacity-50">
                <span class="material-symbols-outlined text-lg">refresh</span>
                <span>뉴스 새로고침</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="text-center space-y-1 mb-6">
            <p class="text-sm text-on-surface-variant/80">Google News RSS에서 실시간 화제 기사를 선별합니다.</p>
        </div>

        <!-- News Container -->
        <div id="newsContainer" class="space-y-4"></div>

        <!-- Infinite Scroll Loader -->
        <div id="infiniteLoader" class="py-8 text-center text-on-surface-variant opacity-0 transition-opacity duration-200">
            <div class="w-7 h-7 border-2 border-primary/20 border-t-primary rounded-full animate-spin mx-auto mb-2"></div>
            <p class="text-xs font-medium text-on-surface-variant/70">더 많은 뉴스를 불러오는 중...</p>
        </div>

        <!-- No More News Alert -->
        <div id="noMoreNews" class="py-8 text-center text-on-surface-variant/60 text-sm font-medium hidden">
            더 이상 뉴스가 없습니다.
        </div>
    </main>

    <!-- Floating Community/Feedback Button -->
    <button id="openFeedbackBtn" class="fixed bottom-6 right-6 z-40 bg-primary text-white hover:bg-primary/90 px-5 py-3.5 rounded-full shadow-2xl flex items-center gap-2 font-bold text-sm transition-all active:scale-95 cursor-pointer">
        <span class="material-symbols-outlined text-xl">forum</span>
        <span>피드백 & 커뮤니티</span>
    </button>

    <!-- Community & Feedback Modal -->
    <div id="feedbackModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel w-full max-w-lg bg-white/95 rounded-[32px] p-6 sm:p-8 border border-white/60 shadow-2xl transform scale-95 transition-all duration-300 modal-box max-h-[90vh] flex flex-col">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-4 border-b border-black/10 shrink-0">
                <div>
                    <h3 class="text-xl font-bold text-primary tracking-tight">커뮤니티 게시판</h3>
                    <p class="text-xs text-on-surface-variant/70 mt-0.5">의견을 남기고 실시간으로 사람들과 소통해보세요.</p>
                </div>
                <button id="closeFeedbackBtn" class="p-2 text-primary/60 hover:text-primary hover:bg-black/5 rounded-full transition-colors cursor-pointer">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="overflow-y-auto custom-scrollbar flex-1 py-4 space-y-6">
                <!-- Submit Form -->
                <form id="feedbackForm" class="space-y-3 bg-black/[0.02] p-4 rounded-2xl border border-black/5">
                    <div class="flex gap-2">
                        <input type="text" id="fbName" placeholder="작성자 / 닉네임 (기본: 익명)" class="w-full bg-white border border-black/10 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 text-primary placeholder:text-primary/40">
                    </div>
                    <div>
                        <textarea id="fbContent" required rows="3" placeholder="피드백이나 자유로운 의견을 작성해주세요." class="w-full bg-white border border-black/10 rounded-xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 text-primary placeholder:text-primary/40 resize-none"></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-2.5 rounded-xl transition-all active:scale-95 text-sm flex items-center justify-center gap-1 cursor-pointer">
                        <span class="material-symbols-outlined text-base">send</span>
                        <span>글 등록하기</span>
                    </button>
                </form>

                <!-- Feedback Realtime List (Community Feed) -->
                <div class="space-y-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-primary/70 px-1">실시간 커뮤니티 피드</h4>
                    <div id="feedbackList" class="space-y-2.5">
                        <div class="text-center py-8 text-on-surface-variant/60 text-xs">
                            글을 불러오는 중입니다...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase JS SDK (v10 ES Module) & App Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            orderBy, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // =========================================================
        // [필수 설정] 본인의 Firebase 대시보드에서 복사한 설정값을 넣으세요!
        // =========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDGbrQclH1hQhcnRepyjeZcr36hf3mBwSs",
      authDomain: "erica-e67dd.firebaseapp.com",
      projectId: "erica-e67dd",
      storageBucket: "erica-e67dd.firebasestorage.app",
      messagingSenderId: "40085931746",
      appId: "1:40085931746:web:bbbf5f0040d8fcc7e7c0bb"
    };
        // Firebase 초기화
        let db = null;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase 초기화 에러: firebaseConfig 설정을 확인하세요.", e);
        }

        // DOM 요소
        const feedbackForm = document.getElementById('feedbackForm');
        const feedbackList = document.getElementById('feedbackList');
        const submitBtn = document.getElementById('submitBtn');

        // 1. 파이어베이스 데이터 제출 (피드백 작성)
        feedbackForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!db) {
                alert("Firebase 설정(firebaseConfig)이 아직 적용되지 않았습니다.\n코드 내 파이어베이스 정보를 먼저 입력해주세요.");
                return;
            }

            const nameInput = document.getElementById('fbName');
            const contentInput = document.getElementById('fbContent');
            const name = nameInput.value.trim() || '익명';
            const content = contentInput.value.trim();

            if (!content) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>등록 중...</span>`;

            try {
                // Firestore 'feedbacks' 컬렉션에 새 문서 추가
                await addDoc(collection(db, "feedbacks"), {
                    name: name,
                    content: content,
                    createdAt: serverTimestamp()
                });

                contentInput.value = '';
                nameInput.value = '';
            } catch (error) {
                console.error("데이터 저장 실패:", error);
                alert("피드백 제출 중 오류가 발생했습니다: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span class="material-symbols-outlined text-base">send</span>
                    <span>피드백 등록하기</span>
                `;
            }
        });

        // 2. 파이어베이스 데이터 실시간 열람 (커뮤니티 목록 불러오기)
        function listenToFeedbacks() {
            if (!db) {
                feedbackList.innerHTML = `
                    <div class="text-center py-6 bg-red-50 text-red-500 rounded-xl text-xs p-4">
                        Firebase 설정이 필요합니다.<br>코드 상단의 firebaseConfig 값을 설정해주세요.
                    </div>
                `;
                return;
            }

            // 생성일시(createdAt) 내림차순 최신순 정렬 쿼리
            const q = query(collection(db, "feedbacks"), orderBy("createdAt", "desc"));

            // 실시간 리스너 (onSnapshot)
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    feedbackList.innerHTML = `
                        <div class="text-center py-8 text-on-surface-variant/60 text-xs bg-black/[0.02] rounded-xl">
                            아직 등록된 피드백이 없습니다.<br>첫 번째 의견을 남겨보세요!
                        </div>
                    `;
                    return;
                }

                feedbackList.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();
                    const formattedDate = dateObj.toLocaleString('ko-KR', {
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const item = document.createElement('div');
                    item.className = 'bg-white p-3.5 rounded-xl border border-black/5 shadow-2xl/5 space-y-1';
                    item.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-xs text-primary">${escapeHtml(data.name)}</span>
                            <span class="text-[10px] text-on-surface-variant/50">${formattedDate}</span>
                        </div>
                        <p class="text-xs text-on-surface-variant leading-relaxed whitespace-pre-line">${escapeHtml(data.content)}</p>
                    `;
                    feedbackList.appendChild(item);
                });
            }, (error) => {
                console.error("데이터 열람 에러:", error);
                feedbackList.innerHTML = `
                    <div class="text-center py-6 text-red-500 text-xs">
                        데이터를 불러오는 중 오류가 발생했습니다.<br>(Firestore 데이터베이스 권한 설정을 확인해주세요)
                    </div>
                `;
            });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 실시간 조회 시작
        listenToFeedbacks();
    </script>

    <!-- 뉴스 기능 및 모달 UI 제어 스크립트 -->
    <script>
        const newsContainer = document.getElementById('newsContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const infiniteLoader = document.getElementById('infiniteLoader');
        const noMoreNews = document.getElementById('noMoreNews');

        let newsData = [];
        let currentPage = 1;
        let hasMore = true;
        let isLoading = false;

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && hasMore && !isLoading) {
                fetchNewsSummaries(currentPage + 1, true);
            }
        }, { rootMargin: '100px' });

        function setupInfiniteScroll() {
            if (infiniteLoader) observer.observe(infiniteLoader);
        }

        function stopInfiniteScroll() {
            if (infiniteLoader) observer.unobserve(infiniteLoader);
        }

        async function fetchNewsSummaries(page = 1, append = false) {
            if (isLoading) return;
            isLoading = true;

            stopInfiniteScroll();

            if (!append) {
                infiniteLoader.classList.remove('opacity-100');
                noMoreNews.classList.add('hidden');
                showLoading();
            } else {
                infiniteLoader.classList.add('opacity-100');
            }
            refreshBtn.disabled = true;

            try {
                const response = await fetch(`/api/generate-summary?page=${page}`);
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `서버 에러가 발생했습니다. (Status: ${response.status})`);
                }

                const data = await response.json();

                if (!append) {
                    newsData = data.items || [];
                    currentPage = data.page || 1;
                    hasMore = data.hasMore ?? false;
                    renderNewsCards(newsData, false);
                } else {
                    newsData = [...newsData, ...(data.items || [])];
                    currentPage = data.page || 1;
                    hasMore = data.hasMore ?? false;
                    renderNewsCards(data.items || [], true);
                }

                if (!hasMore) {
                    infiniteLoader.classList.remove('opacity-100');
                    noMoreNews.classList.remove('hidden');
                } else {
                    infiniteLoader.classList.remove('opacity-100');
                    setupInfiniteScroll();
                }
            } catch (error) {
                console.error("Error:", error);
                if (!append) {
                    showError(error.message);
                } else {
                    infiniteLoader.classList.remove('opacity-100');
                }
            } finally {
                isLoading = false;
                refreshBtn.disabled = false;
            }
        }

        function renderNewsCards(newsItems, append = false) {
            if (!Array.isArray(newsItems) || newsItems.length === 0) {
                if (!append) showError("표시할 뉴스 데이터가 없습니다.");
                return;
            }

            if (!append) newsContainer.innerHTML = '';

            newsItems.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'news-card bg-white rounded-[32px] p-2 shadow-sm border border-black/[0.03] transition-all hover:shadow-md';

                card.innerHTML = `
                    <div class="glass-panel w-full rounded-[28px] overflow-hidden flex flex-col relative specular-border p-6 sm:p-8">
                        <div class="news-header cursor-pointer flex justify-between items-start gap-4">
                            <div class="news-main-info space-y-2 flex-1">
                                <span class="inline-block px-3 py-1 rounded-full text-[11px] font-bold bg-black/[0.05] text-primary tracking-wider uppercase">${item.category || '뉴스'}</span>
                                <h2 class="font-display-lg text-lg sm:text-2xl font-bold text-primary tracking-tight leading-snug">${item.title}</h2>
                                <p class="text-on-surface-variant font-body-md text-sm sm:text-base leading-relaxed">${item.summary}</p>
                            </div>
                            <button class="toggle-btn p-2 rounded-full hover:bg-black/5 text-primary/60 hover:text-primary transition-all shrink-0 cursor-pointer">
                                <span class="material-symbols-outlined text-2xl transition-transform duration-300 chevron-icon">keyboard_arrow_down</span>
                            </button>
                        </div>
                        <div class="news-detail-wrapper max-h-0 overflow-hidden transition-all duration-300 ease-in-out opacity-0">
                            <div class="pt-6 mt-6 border-t border-black/[0.06] news-detail-content">
                                <div class="detail-loading text-center py-4 text-on-surface-variant flex flex-col items-center gap-2">
                                    <div class="w-6 h-6 border-2 border-primary/20 border-t-primary rounded-full animate-spin"></div>
                                    <p class="text-xs font-medium">상세 정보 로드 중...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const headerEl = card.querySelector('.news-header');
                const detailWrapper = card.querySelector('.news-detail-wrapper');
                const chevronIcon = card.querySelector('.chevron-icon');
                let detailLoaded = false;
                let isFetchingDetail = false;

                headerEl.addEventListener('click', async () => {
                    const isExpanded = card.classList.contains('active');

                    if (isExpanded) {
                        card.classList.remove('active');
                        detailWrapper.style.maxHeight = '0px';
                        detailWrapper.classList.remove('opacity-100');
                        detailWrapper.classList.add('opacity-0');
                        chevronIcon.classList.remove('rotate-180');
                    } else {
                        card.classList.add('active');
                        chevronIcon.classList.add('rotate-180');

                        if (!detailLoaded && !isFetchingDetail) {
                            isFetchingDetail = true;
                            detailWrapper.style.maxHeight = '150px';
                            detailWrapper.classList.remove('opacity-0');
                            detailWrapper.classList.add('opacity-100');

                            try {
                                const response = await fetch(`/api/generate-detail?id=${item.id}&title=${encodeURIComponent(item.title)}`);
                                if (!response.ok) {
                                    const errData = await response.json().catch(() => ({}));
                                    throw new Error(errData.error || '상세 정보 로드 실패');
                                }

                                const detail = await response.json();

                                detailWrapper.innerHTML = `
                                    <div class="pt-6 mt-6 border-t border-black/[0.06] news-detail-content space-y-2">
                                        <h4 class="font-bold text-xs uppercase tracking-widest text-primary/70">상세 브리핑</h4>
                                        <p class="text-on-surface-variant text-sm sm:text-base leading-relaxed whitespace-pre-line">${detail.details}</p>
                                    </div>
                                `;
                                detailLoaded = true;
                                detailWrapper.style.maxHeight = detailWrapper.scrollHeight + 50 + 'px';
                            } catch (error) {
                                console.error("Detail Fetch Error:", error);
                                detailWrapper.innerHTML = `
                                    <div class="pt-6 mt-6 border-t border-black/[0.06] news-detail-content text-red-500 text-sm text-center py-4">
                                        <p>${error.message || '상세 정보를 불러올 수 없습니다.'}</p>
                                    </div>
                                `;
                                detailWrapper.style.maxHeight = detailWrapper.scrollHeight + 50 + 'px';
                            } finally {
                                isFetchingDetail = false;
                            }
                        } else {
                            detailWrapper.style.maxHeight = detailWrapper.scrollHeight + 50 + 'px';
                            detailWrapper.classList.remove('opacity-0');
                            detailWrapper.classList.add('opacity-100');
                        }
                    }
                });

                newsContainer.appendChild(card);
            });
        }

        function showLoading() {
            newsContainer.innerHTML = `
                <div class="py-16 text-center text-on-surface-variant">
                    <div class="w-9 h-9 border-2 border-primary/20 border-t-primary rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-sm font-medium">뉴스 목록을 불러오는 중입니다...</p>
                </div>
            `;
        }

        function showError(message) {
            newsContainer.innerHTML = `
                <div class="py-16 text-center">
                    <p class="text-red-500 font-medium mb-2">${message}</p>
                    <p class="text-xs text-on-surface-variant/60">문제가 계속되면 개발자 콘솔을 확인하세요.</p>
                </div>
            `;
        }

        refreshBtn.addEventListener('click', () => {
            currentPage = 1;
            hasMore = true;
            fetchNewsSummaries(1, false);
        });

        fetchNewsSummaries(1, false);

        // Modal UI Controls
        const openFeedbackBtn = document.getElementById('openFeedbackBtn');
        const closeFeedbackBtn = document.getElementById('closeFeedbackBtn');
        const feedbackModal = document.getElementById('feedbackModal');

        const closeModal = () => {
            feedbackModal.classList.add('opacity-0', 'pointer-events-none');
            const modalBox = feedbackModal.querySelector('.modal-box');
            if (modalBox) {
                modalBox.classList.remove('scale-100');
                modalBox.classList.add('scale-95');
            }
        };

        openFeedbackBtn.addEventListener('click', () => {
            feedbackModal.classList.remove('opacity-0', 'pointer-events-none');
            const modalBox = feedbackModal.querySelector('.modal-box');
            if (modalBox) {
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
            }
        });

        closeFeedbackBtn.addEventListener('click', closeModal);

        feedbackModal.addEventListener('click', (e) => {
            if (e.target === feedbackModal) closeModal();
        });
    </script>
</body>
</html>
